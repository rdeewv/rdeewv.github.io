<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>
<body>
  <script>
  // Get path without leading/trailing slash
  const path = window.location.pathname.replace(/^\/+|\/+$/g, "");

  // If homepage, stop
  if (!path) {
    window.location.href = "/";
  }

  fetch("/links.json")
    .then(res => res.json())
    .then(data => {
      // Match slug OR urlcode
      const match = data.find(link =>
        link.slug === path || link.urlcode === path
      );

      if (match) {
        window.location.replace(match.url);
      } else {
        document.body.innerHTML = "<h2>404 - Link not found</h2>";
      }
    })
    .catch(() => {
      document.body.innerHTML = "<h2>Error loading links</h2>";
    });
</script>
</body>
</html>
