name: Prettify JSON (jq safe)

on:
  push:
    paths:
      - '**.json'

# ✅ Required for pushing commits back
permissions:
  contents: write

jobs:
  format-json:
    runs-on: ubuntu-latest

    # ✅ Infinite loop protection
    if: github.actor != 'github-actions[bot]'

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install jq
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3️⃣ Format + sort all JSON
      - name: Prettify JSON files
        run: |
          changed=false

          for file in $(find . -name "*.json"); do
            echo "Formatting $file"

            jq -S '.' "$file" > tmp.json

            if ! cmp -s tmp.json "$file"; then
              mv tmp.json "$file"
              changed=true
            else
              rm tmp.json
            fi
          done

          echo "changed=$changed" >> $GITHUB_ENV

      # 4️⃣ Commit only if changed
      - name: Commit changes
        if: env.changed == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add .
          git commit -m "chore: prettify json via jq"
          git push
