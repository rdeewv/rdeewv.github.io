name: Prettify links.json (jq safe)

on:
  push:
    paths:
      - 'links.json'

# ✅ Allow Action to push commit
permissions:
  contents: write

jobs:
  format-json:
    runs-on: ubuntu-latest

    # ✅ Prevent infinite loop
    if: github.actor != 'github-actions[bot]'

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install jq
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3️⃣ Prettify links.json
      - name: Format links.json
        run: |
          jq -S '.' links.json > tmp.json

          if ! cmp -s tmp.json links.json; then
            mv tmp.json links.json
            echo "changed=true" >> $GITHUB_ENV
          else
            rm tmp.json
            echo "changed=false" >> $GITHUB_ENV
          fi

      # 4️⃣ Commit if changed
      - name: Commit changes
        if: env.changed == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add links.json
          git commit -m "chore: prettify links.json"
          git push
