<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>
<body>
  <script>
    const path = window.location.pathname.replace("/", "");

    fetch("/links.json")
      .then(res => res.json())
      .then(data => {
        const match = data.find(link => link.slug === path);

        if (match) {
          window.location.href = match.url;
        } else {
          document.body.innerHTML = "<h2>Link not found</h2>";
        }
      })
      .catch(() => {
        document.body.innerHTML = "<h2>Error loading links</h2>";
      });
  </script>
</body>
</html>
